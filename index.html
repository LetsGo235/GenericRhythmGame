<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b18">
  <title>Pulse//Space</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" aria-label="Pulse Space rhythm game"></canvas>

  <!-- Native pickers are invisible; every visible control is drawn in Canvas. -->
  <input id="audioPicker" type="file" accept="audio/*,.egg" hidden>
  <input id="coverPicker" type="file" accept="image/*" hidden>
  <input id="packPicker" type="file" accept=".pulsepack,.json,application/json" hidden>
  <input id="foreignPicker" type="file" accept=".osz,.osu,.sm,.ssc,.qua,.qp,.chart,.json,.zip,.bplist" hidden>

  <script src="js/storage.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/data.js"></script>
  <script src="js/converters.js"></script>
  <script src="songs/manifest.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
